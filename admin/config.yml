backend:
  name: github
  repo: thetorchlearning/the-torch-academy
  branch: main
  # Complete the GitHub OAuth provider setup in Netlify before signing in.

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

publish_mode: editorial_workflow
site_url: https://thetorchacademy.ng
display_url: https://thetorchacademy.ng

collections:
  - name: "blog"
    label: "Torch Insights Articles"
    label_singular: "Torch Insights Article"
    folder: "blog/posts"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    preview_path: "blog/{{slug}}/"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Short description", name: "description", widget: "text" }
      - { label: "Featured image", name: "featured_image", widget: "image", required: false }
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - "Mathematics"
          - "Sciences"
          - "Parenting and Education"
          - "Study Skills"
          - "Examination Preparation"
          - "Learning Resources"
          - "Educational Technology"
      - { label: "Publication date", name: "date", widget: "datetime", time_format: false, format: "YYYY-MM-DD" }
      - label: "Article"
        name: "body"
        widget: "markdown"
        hint: "Write your article here. To add an image, place the cursor where it should appear and use the image button in the editor toolbar, or choose Image with caption to add a caption and placement. You can repeat this for as many images as you need. Use the editor toolbar to insert Editorial paragraph boxes and sentence highlights. YouTube embed HTML can also be pasted into the article."
